<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wordly Dictionary</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Wordly</h1>

  <form id="search-form">
    <input id="word-input" type="text" placeholder="Search a word" />
    <button type="submit">Search</button>
  </form>

  <p id="error" class="error"></p>

  <section id="result"></section>

  <h2>Saved Words</h2>
  <ul id="saved-list"></ul>

  <script src="script.js"></script>
</body>
</html>
